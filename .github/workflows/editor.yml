name: Editor CI

on:
  pull_request:
    paths:
      - "apps/editor/**"
      - ".github/workflows/editor.yml"
  push:
    branches: [main]
    paths:
      - "apps/editor/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/editor

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/editor/package-lock.json
      - run: npm ci
      - run: npm run fmt
      - run: npm run lint
      - run: npm test
      - run: npm run build
